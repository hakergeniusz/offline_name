[package]
name = "horizon-offline_name"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Join servers with a per-server offline name, and log in automatically. A Horizon native mod."
publish = false

# The runtime doubles as the mod's library (its tests) and the module the
# bundle injects into the game; the helper files compile only inside it.
[lib]
path = "mixins/offline_name/runtime.rs"
